name: Release

# Triggered by pushing a tag like "release_0.0.1" -> creates GitHub release
# "release_0.0.1" titled "v0.0.1", with every built binary tarball and
# OpenWRT .ipk attached as release assets.

on:
  push:
    tags:
      - "release_*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#release_}"
          if [ "$version" = "$tag" ] || [ -z "$version" ]; then
            echo "error: tag '$tag' must look like release_<version>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${VERSION}" \
            --generate-notes \
            artifacts/*
