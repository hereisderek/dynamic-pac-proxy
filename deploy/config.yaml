# dynamic-pac-proxy config.
#
# Edits to this file are picked up automatically within a few seconds while
# the service is running (no restart needed) — except listen_addr, which
# requires a restart since it means rebinding the HTTP listener. Adding or
# removing entries from `hosts`, and per-host settings, also apply live.

listen_addr: ":8080"

# The LAN IP or hostname client devices use to reach this box — this is
# what gets baked into the PAC files at /proxy/<name>.pac. Auto-detected as
# a best guess at startup if left unset, but set it explicitly if this box
# is multi-homed or the auto-detected address isn't what devices can reach.
advertise_host: "172.16.2.22"

# How long a host's cached health check stays valid. Checks are lazy: they
# only happen when a request comes in for a host whose cache is older than
# this, not on a fixed background timer.
refresh_interval: 15s
mdns_timeout: 2s
dial_timeout: 1s

# If a request actually fails to reach Charles despite the cache saying it
# was reachable, the cache is invalidated right away instead of waiting out
# the rest of refresh_interval — but at most once per failure_cooldown, so
# a burst of failing requests doesn't force a recheck on every single one.
failure_cooldown: 5s

# Directory served at http://<advertise_host>:8080/certs, for downloading
# and installing Charles's SSL root certificate (see certs/README.md).
# Defaults to a "certs" folder next to this config file if left unset.
# certs_dir: "certs"

hosts:
  - name: derek-macbook
    mdns_hostname: dereks-MacBook-Pro.local
    port: 8888        # the port Charles listens on, on that Mac
    listen_port: 8081  # the port THIS box listens on for this host — point
                       # devices' proxy settings (or /proxy/derek-macbook.pac)
                       # at advertise_host:8081; traffic is forwarded to
                       # Charles when it's reachable, DIRECT when it's not.

  # A second host, with its own ports, a per-host override of the defaults
  # above (any of refresh_interval / mdns_timeout / dial_timeout /
  # failure_cooldown can be overridden per host; omit to inherit the
  # top-level default), and SSL interception enabled (see the "SSL
  # interception" section of README.md — installing
  # certs/dynamic-pac-proxy-ca.pem on the client is required for this to
  # work instead of every HTTPS site failing to load).
  # - name: office-pc
  #   mdns_hostname: office-desktop.local
  #   port: 9999
  #   listen_port: 8082
  #   refresh_interval: 5s
  #   dial_timeout: 500ms
  #   intercept_ssl: true

  # A host with a fixed IP instead of an mDNS hostname — for a machine
  # that already has a static/reserved address, or that doesn't answer
  # mDNS at all (e.g. a mitmproxy instance). Exactly one of mdns_hostname
  # or host_ip must be set per host, never both.
  # - name: mitmproxy-box
  #   host_ip: "172.16.2.23"
  #   port: 8080         # mitmproxy's regular proxy port
  #   listen_port: 8083
